# Enable mouse support.
set -g mouse on

# Enable clipboard integration when supported by the terminal.
set-option -g set-clipboard on

# Use Ctrl-Space as the tmux prefix instead of Ctrl-b.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1, not 0.
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Use Vim-style keys in copy mode.
set-window-option -g mode-keys vi

# Restore clear screen with Prefix + Ctrl-l.
bind C-l send-keys 'C-l'

# Change windows with Shift + Alt + H/L.
bind -n M-H previous-window
bind -n M-L next-window

# Colemak-DH window aliases.
bind a select-window -t 1
bind r select-window -t 2
bind s select-window -t 3
bind t select-window -t 4
bind g select-window -t 5
bind m select-window -t 6
bind n select-window -t 7

# Vim-style copy mode selection.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in the current directory.
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Open windows in the current directory.
bind c new-window -c "#{pane_current_path}"

# Resize panes with Ctrl + Alt + h/j/k/l.
bind -n C-M-h resize-pane -L 2
bind -n C-M-j resize-pane -D 2
bind -n C-M-k resize-pane -U 2
bind -n C-M-l resize-pane -R 2

# Reload config with Prefix + e.
bind e source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."
